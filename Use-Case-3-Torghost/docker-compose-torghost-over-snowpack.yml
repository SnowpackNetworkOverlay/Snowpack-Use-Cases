---
version: "2.1"
services:
    snowpack:
      image: snowpackvipn/snowpack-user:latest
      environment:
      #Replace your login credentials here! YOU NEED TO HAVE AT LEAST SUBSCRIBED TO A REDSNOW PLAN!
        USER: 'myusername' 
        PASSWORD: 'Password1234'
        # List of possible args:
        #    -a for automatic route selection
        #    -r for manual route selection 
        # Refer to the README file for more options
        ADDITIONAL_ARGS: ' -a'
      volumes:
        - ./config_user_routes.json:/root/config_user_routes.json
      container_name: snowpackuser
      networks:
        use-case-n-3-torghost:
          ipv4_address: 192.168.96.2
      privileged: true
      stdin_open: true
      tty: true

      healthcheck:
        test: sudo nft list ruleset | grep -q 'SNOWPACK';
        timeout: 30s
        interval: 1s
        retries: 3

    torghost:
      image: torghostkali:1.0
      container_name: torghost-over-snowpack
      cap_add:
        - NET_ADMIN
      network_mode: service:snowpack
      stdin_open: true
      tty: true

networks:
  use-case-n-3-torghost:
    name: use-case-n-3-torghost
    ipam:
      config:
      - subnet: "192.168.96.0/19"
        ip_range: "192.168.96.0/19"
